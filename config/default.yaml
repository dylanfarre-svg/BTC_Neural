# BTC_Neural default configuration.
# Override locally by creating config/local.yaml with the keys you want to change.

db_path: data/btc_neural.db
runs_dir: runs

# --- Cycle reference data -------------------------------------------------
# Halvings are known in advance, so the model may use them as causal inputs.
halvings: ["2012-11-28", "2016-07-09", "2020-05-11", "2024-04-20"]
next_halving_estimate: "2028-04-15"

# Cycle extremes are HINDSIGHT information. They are used ONLY for labels and
# evaluation, never as model inputs. Each date is approximate; the code snaps it to the
# actual highest/lowest daily close within +/- extreme_search_days.
extremes:
  - {kind: top, date: "2011-06-08"}
  - {kind: low, date: "2011-11-18"}
  - {kind: top, date: "2013-12-04"}
  - {kind: low, date: "2015-01-14"}
  - {kind: top, date: "2017-12-17"}
  - {kind: low, date: "2018-12-15"}
  - {kind: top, date: "2021-11-10"}
  - {kind: low, date: "2022-11-21"}
  - {kind: top, date: "2025-10-06"}
extreme_search_days: 45
# An extreme may label training rows only once the training cutoff is at least this
# many days past it (it would have been "obvious" by then).
extreme_confirm_days: 180

# --- Labels ----------------------------------------------------------------
label:
  kind: cycle          # cycle | window
  window_half_days: 365  # used by kind=window

# --- Walk-forward folds (halving epochs) ------------------------------------
# Each halving epoch contains exactly one cycle top and one cycle low, so every test
# fold holds one complete top and bottom (the current epoch's low is still pending).
folds:
  min_train_days: 450
  selection_folds: ["E2", "E3", "E4"]   # E1 is reported but its training set is tiny

# --- Signal calibration ------------------------------------------------------
# Cumulative days per 4-year cycle (1460 days) at >= each strength level, per side.
# Strength 10 = 10 days per cycle, as requested.
signal_budget:
  10: 10
  9: 22
  8: 38
  7: 60
  6: 90
  5: 130
  4: 180
  3: 240
  2: 310
  1: 400
calibration: oof       # how frozen thresholds are fitted: oof (inner leave-one-epoch-out) | insample
# How scores become strengths:
#   frozen   - thresholds fitted on the training period, applied unchanged
#   trailing - causal rank of today's score within the model's own last `trailing_window` days
#   hybrid   - the stronger of the two when they agree in sign
#   adaptive - trailing, but the window runs from the last confirmed opposite extreme
#   both     - the weaker of the two (must be extreme in absolute AND relative terms)
strength_mode: trailing
trailing_window: 1095
# For strength_mode: adaptive - the window runs from the last confirmed opposite extreme instead
# of a fixed length, clipped to this range.
trailing_adaptive:
  anchor: same        # same = window stops just before the previous same-side extreme | opposite
  margin_days: 30
  min_days: 365
  max_days: 1825
# Thin out strength-10 clusters (see calibrate.decluster): none | cooldown | cap | plateau
# Without this the models fire strength 10 for weeks during a parabolic advance, far below the
# eventual top (68 days at a median 64% below the 2017 top). After a 10 fires, the next one needs
# either 120 days to pass or a score 0.05 more extreme than the one that fired; suppressed days
# show as 9. Walk-forward: worst-cycle score 0.511 +/- 0.012 vs 0.679 +/- 0.006 without (6 seeds).
declustering:
  mode: cooldown      # none | cooldown | cap | plateau
  gap_days: 120
  improve: 0.05

# --- Evaluation ------------------------------------------------------------
evaluation:
  hit_log_distance: 0.29   # |ln(P/P_extreme)| <= 0.29  (~25% below a top / ~33% above a low)
  strong_level: 8

# --- Trading simulation (secondary; South African tax) -----------------------
simulation:
  monthly_contribution_usd: 1000
  base_dca_fraction: 0.5        # share of each contribution bought immediately; rest goes to reserve
  fee_rate: 0.005
  core_floor_fraction: 0.25     # never sell below 25% of peak BTC held
  # Fraction of reserve cash deployed per day at each buy strength
  buy_fraction: {5: 0.02, 6: 0.04, 7: 0.07, 8: 0.10, 9: 0.15, 10: 0.25}
  # Fraction of sellable BTC (above the core floor) sold per day at each sell strength
  sell_fraction: {6: 0.01, 7: 0.02, 8: 0.03, 9: 0.05, 10: 0.08}
  tax:
    regime: za_cgt              # South African capital gains tax (individual, investor)
    lot_method: fifo            # fifo | hifo | average
    inclusion_rate: 0.40        # 40% of net gain included in taxable income
    marginal_rate: 0.45         # your marginal income-tax rate
    annual_exclusion_zar: 40000
    tax_year_start_month: 3     # SA tax year: 1 March - end February
    usd_zar_series: DEXSFUS     # FRED USD/ZAR, used to compute gains in rand

# --- Models ----------------------------------------------------------------
models:
  nn:
    seeds: 8
    epochs: 120
    seq_weeks: 52
    lr: 0.001
    weight_decay: 0.001
    dropout: 0.3
    input_noise: 0.10
    batch_size: 512
    epoch_fraction: 0.35   # share of (highly autocorrelated) daily rows sampled per epoch
    device: auto           # auto (Apple MPS if available) | cpu
  lgbm:
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 7
    min_child_samples: 80
    subsample: 0.7
    colsample_bytree: 0.7
    reg_lambda: 5.0

# In-sample cutoff for the saved (production / candidate) models: labels, model fitting and
# calibration thresholds use nothing after this date, so everything later is a genuine holdout
# recorded day by day in the append-only live_signals table. Set to null to use all data.
# (Walk-forward folds are unaffected: each fold already stops at the start of its test epoch.)
training_cutoff: "2026-01-01"

# --- Live / notifications ----------------------------------------------------
live:
  retrain_after_days: 30
  stale_after_days: 3
notify:
  ntfy_server: https://ntfy.sh
  macos: true
  strong_level: 7
  regime_change_levels: 3
  nn_disagreement_levels: 5
  weekly_digest_weekday: 6    # Sunday (Mon=0)
  dashboard_url: http://localhost:8501

# --- Next-extreme forecast (statistical cycle-analog model, shown on the Home chart) ---
forecast:
  analog_cycles: 3        # most recent past cycles used as analogs (the 2011 cycle is excluded as immature)
  min_date_sd_days: 30    # floor on the date uncertainty (1 sigma)
  min_logp_sd: 0.15       # floor on the log-price uncertainty (1 sigma, ~16%)
  halving_sd_days: 20     # uncertainty in the estimated date of the next halving

# --- Trading signals (research) ---------------------------------------------------
# Discrete trade proposals on shorter horizons, separate from the cycle signal above.
# See PLAN_SWING.md. Nothing in this block changes the cycle model. Swing signals are
# logged to the append-only trade_signals table and are NEVER pushed to ntfy.
trade:
  dashboard_url: http://localhost:8503
  swing:
    bars: 1d                    # one decision per day, at the daily close (00:00 UTC)
    resolve_on: 4h              # barriers are walked on 4h bars (removes same-bar ambiguity)
    hold_days: {min: 7, max: 28}
    sides: [long, short]
    barrier:
      mode: vol_scaled
      sigma_mult: 1.0           # target = 1 sigma of 14-day vol (daily vol over 30 days x sqrt 14) ...
      floor: 0.05               # ... never less than 5%
      stop_ratio: 0.6           # stop at 0.6 x the target distance
      vol_window_days: 30
    cooldown_days: 5
    max_concurrent: 1
    target_trades_per_year: 20
    costs:
      # ASSUMPTION until the real venue's schedule is supplied (PLAN_SWING.md Q4): 0.1% per side,
      # typical of a retail order-book taker fee. Results are also reported across a fee sweep.
      fee_rate: 0.001
      slippage: 0.0005          # per side
      funding:
        enabled: true
        sides: [short]          # longs are spot; shorts are perps, which pay or receive funding
        fallback_8h: 0.0001     # used where no funding history exists
    tax:
      treatments: [capital, revenue]
      capital: {inclusion_rate: 0.40, marginal_rate: 0.45}
      revenue: {marginal_rate: 0.45}
      tax_year_start_month: 3
    folds:
      block_days: 90
      purge_days: 28            # = hold_days.max: labels of purged rows reach into the test block
      embargo_days: 10          # inert for forward-only walk-forward; kept for k-fold use
      min_train_days: 730
      train_start: "2012-01-01"
      warmup_start: "2014-01-01"  # OOS scores from here feed the causal trade thresholds
    backtest_start: "2015-01-01"
    short_start: "2019-01-01"   # shorts are not simulated before liquid perp venues existed
    modern_start: "2019-01-01"  # Q17: the result must also hold on this subsample alone
    holdout_days: 365           # final year excluded from all selection ...
    holdout_start: "2025-10-30" # ... pinned when the grid was pre-registered, so it cannot drift
    threshold:
      trailing_days: 730        # trade when today's score beats this quantile of the model's own
      quantiles: [0.75, 0.80, 0.85, 0.90, 0.95]  # trailing OOS scores (a grid dimension)
    min_trades_per_year: 12     # selection eligibility band around target_trades_per_year
    max_trades_per_year: 30
  intraday:                     # planned, not built: PLAN_SWING.md section 13
    bars: 4h
    resolve_on: 4h
    hold_days: {min: 0.17, max: 4}
    barrier: {mode: vol_scaled, sigma_mult: 1.0, floor: 0.02, stop_ratio: 0.6, vol_window_days: 30}
    folds: {block_days: 30, purge_days: 4, embargo_days: 2, min_train_days: 730}
